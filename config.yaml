data:
  matches_csv: data/raw/atp_matches_till_2022.csv
  players_csv: data/raw/atp_players_till_2022.csv
  rankings_csv: data/raw/atp_rankings_till_2022.csv

elo:
  k_factor: 32
  surfaces: [Hard, Clay, Grass, Carpet]

features:
  window_size: 10

split:
  # Train: matches before this date. Test: matches from this date onward (2022 season).
  cutting_date: "2021-12-01"

model:
  n_estimators: 300
  max_depth: 20
  min_samples_leaf: 50
  n_jobs: -1
  random_state: 42

dataset_seed: 42

# Value-betting backtest (src/backtest.py). Not yet wired to a real
# odds dataset in this repo -- see scripts/download_odds.py and the
# README's Known limitations. Defaults here are a starting point, not
# tuned values: pick the edge threshold via
# backtest.choose_threshold_and_evaluate_holdout on validation
# seasons, never against the same holdout you report results on.
backtest:
  edge_thresholds: [0.02, 0.05, 0.08, 0.12]
  stake_strategy: flat  # or "kelly"
  flat_stake: 1.0
  kelly_fraction_mult: 0.25
  initial_bankroll: 100.0
